<!DOCTYPE html>
<html>
<head>
<title>3D Rubik's Cube</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#111;color:white;
 font-family:Arial;overflow:hidden
}
#ui{
 position:absolute;top:20px;width:100%;
 text-align:center;z-index:10
}
h1{margin:0 0 8px}
button{
 padding:13px 28px;border:0;border-radius:10px;
 background:#6366f1;color:white;
 font-size:16px;font-weight:bold;cursor:pointer
}
button:hover{background:#818cf8}
#msg{margin:12px;color:#22c55e;font-weight:bold}
</style>
</head>

<body>

<div id="ui">
<h1>🧩 RUBIK'S CUBE</h1>
<div id="msg">🔀 Scrambling...</div>
<button id="solveBtn">AUTO SOLVE 🤖</button>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x111111);

const camera=new THREE.PerspectiveCamera(
45,innerWidth/innerHeight,.1,100
);
camera.position.set(5,5,7);
camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,2));

const light=new THREE.DirectionalLight(0xffffff,3);
light.position.set(5,8,10);
scene.add(light);

let cubes=[];
let moves=[];
let busy=false;

const colors=[
0xffffff,0xffff00,0xff0000,
0xff8800,0x00bb55,0x0066ff
];

function createCube(){

 for(let x=-1;x<=1;x++)
 for(let y=-1;y<=1;y++)
 for(let z=-1;z<=1;z++){

  let mat=[
   new THREE.MeshStandardMaterial({color:x==1?colors[2]:0x222222}),
   new THREE.MeshStandardMaterial({color:x==-1?colors[3]:0x222222}),
   new THREE.MeshStandardMaterial({color:y==1?colors[0]:0x222222}),
   new THREE.MeshStandardMaterial({color:y==-1?colors[1]:0x222222}),
   new THREE.MeshStandardMaterial({color:z==1?colors[4]:0x222222}),
   new THREE.MeshStandardMaterial({color:z==-1?colors[5]:0x222222})
  ];

  let c=new THREE.Mesh(
   new THREE.BoxGeometry(.96,.96,.96),mat
  );

  c.position.set(x,y,z);
  scene.add(c);
  cubes.push(c);
 }
}

createCube();

function rotate(axis,value,dir,done){

 let group=new THREE.Group();
 scene.add(group);

 let selected=cubes.filter(c=>
  Math.round(c.position[axis])==value
 );

 selected.forEach(c=>{
  scene.remove(c);
  group.add(c);
 });

 let angle=0;
 let target=Math.PI/2*dir;

 function animation(){

  angle+=0.08*dir;

  if(Math.abs(angle)<Math.PI/2){
   group.rotation[axis]=angle;
   requestAnimationFrame(animation);
  }else{

   group.rotation[axis]=target;
   group.updateMatrixWorld(true);

   selected.forEach(c=>{
    c.applyMatrix4(group.matrix);
    scene.add(c);
   });

   scene.remove(group);
   done();
  }
 }

 animation();
}

function randomMove(){

 let axis=["x","y","z"][Math.floor(Math.random()*3)];
 let value=[-1,0,1][Math.floor(Math.random()*3)];
 let dir=Math.random()<.5?1:-1;

 return {axis,value,dir};
}

function scramble(){

 busy=true;
 moves=[];
 let count=0;

 msg.innerHTML="🔀 Scrambling...";

 function next(){

  if(count>=8){
   busy=false;
   msg.innerHTML="🔀 Scrambled! Click AUTO SOLVE";
   return;
  }

  let m=randomMove();
  moves.push(m);

  rotate(m.axis,m.value,m.dir,()=>{
   count++;
   setTimeout(next,180);
  });
 }

 next();
}

function solve(){

 if(busy || moves.length==0)return;

 busy=true;
 msg.innerHTML="🤖 Solving...";

 let list=[...moves].reverse();
 let count=0;

 function next(){

  if(count>=list.length){
   busy=false;
   moves=[];
   msg.innerHTML="✅ SOLVED!";
   return;
  }

  let m=list[count];

  rotate(
   m.axis,
   m.value,
   -m.dir,
   ()=>{
    count++;
    setTimeout(next,300);
   }
  );
 }

 next();
}

/* IMPORTANT: Button ko JavaScript se connect kiya */
document.getElementById("solveBtn").addEventListener("click",solve);

function animate(){
 requestAnimationFrame(animate);
 scene.rotation.y+=0.003;
 renderer.render(scene,camera);
}

animate();

setTimeout(scramble,800);

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
